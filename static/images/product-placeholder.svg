<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title description">
  <title id="title">Platinum product image placeholder</title>
  <desc id="description">A refined neutral placeholder for product imagery that is not yet available.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f6f2"/>
      <stop offset="0.5" stop-color="#ece9e1"/>
      <stop offset="1" stop-color="#ded9ce"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="44%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#background)"/>
  <rect width="1200" height="1500" fill="url(#glow)"/>
  <circle cx="600" cy="640" r="230" fill="none" stroke="#9a7b3a" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="600" cy="640" r="178" fill="none" stroke="#9a7b3a" stroke-opacity=".12" stroke-width="1"/>
  <path d="M600 458 678 640 600 822 522 640Z" fill="none" stroke="#9a7b3a" stroke-opacity=".42" stroke-width="3"/>
  <text x="600" y="1025" text-anchor="middle" fill="#6b5520" font-family="Georgia,serif" font-size="54" letter-spacing="18">PLATINUM</text>
  <text x="600" y="1090" text-anchor="middle" fill="#7a7a75" font-family="Arial,sans-serif" font-size="18" letter-spacing="9">IMAGE FORTHCOMING</text>
</svg>
